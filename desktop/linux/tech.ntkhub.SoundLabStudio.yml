app-id: tech.ntkhub.SoundLabStudio
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: ntk-soundlab-studio
finish-args:
  - --share=network
modules:
  - name: soundlab
    buildsystem: simple
    build-commands:
      - install -Dm755 ntk-soundlab-studio /app/bin/ntk-soundlab-studio
      - install -Dm644 tech.ntkhub.SoundLabStudio.desktop /app/share/applications/tech.ntkhub.SoundLabStudio.desktop
      - install -Dm644 tech.ntkhub.SoundLabStudio.metainfo.xml /app/share/metainfo/tech.ntkhub.SoundLabStudio.metainfo.xml
      - install -Dm644 tech.ntkhub.SoundLabStudio.png /app/share/icons/hicolor/128x128/apps/tech.ntkhub.SoundLabStudio.png
    sources:
      - type: file
        path: ntk-soundlab-studio
      - type: file
        path: tech.ntkhub.SoundLabStudio.desktop
      - type: file
        path: tech.ntkhub.SoundLabStudio.metainfo.xml
      - type: file
        path: tech.ntkhub.SoundLabStudio.png
