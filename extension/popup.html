<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NTK SoundLab Media Grabber</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 410px;
      min-height: 260px;
      max-height: 560px;
      background: #0a0e17;
      color: #f8fafc;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      padding-bottom: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 14px;
      color: #67e8f9;
    }
    .sub {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }
    .target-row {
      display: flex;
      gap: 6px;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 11px;
    }
    .target-row select {
      flex: 1;
      background: #111827;
      color: #f8fafc;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 11px;
    }
    .btn {
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(255, 255, 255, 0.07);
      color: #f8fafc;
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.14); }
    .btn-primary {
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      border-color: #06b6d4;
      color: #fff;
      font-weight: 700;
    }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .streams {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      max-height: 360px;
    }
    .item {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 999px;
      text-transform: uppercase;
    }
    .badge-audio { background: rgba(6, 182, 212, 0.2); color: #67e8f9; }
    .badge-video { background: rgba(139, 92, 246, 0.25); color: #c4b5fd; }
    .badge-manifest { background: rgba(245, 158, 11, 0.22); color: #fde68a; }
    .url-line {
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 10px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .empty {
      padding: 20px 12px;
      text-align: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(148, 163, 184, 0.25);
      border-radius: 10px;
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.5;
    }
    .status {
      font-size: 11px;
      color: #6ee7b7;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="brand">⚡ NTK SoundLab Grabber</div>
      <div id="pageTitle" class="sub">Scanning active tab...</div>
    </div>
    <button id="btnClear" class="btn" title="Clear captured list for this tab">Clear</button>
  </header>

  <div class="target-row">
    <span style="color:#94a3b8;font-weight:600">Send to:</span>
    <select id="studioTarget">
      <option value="https://studio-5090403114-fc98b.web.app/">Live Web Studio (Firebase)</option>
      <option value="http://127.0.0.1:47831/">SoundLab Desktop App (127.0.0.1:47831)</option>
      <option value="http://127.0.0.1:8000/">Local Laravel / Server (127.0.0.1:8000)</option>
    </select>
  </div>

  <div id="statusLine" class="status"></div>
  <div id="streamsList" class="streams"></div>

  <script src="popup.js"></script>
</body>
</html>
